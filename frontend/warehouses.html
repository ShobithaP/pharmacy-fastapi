<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Warehouse Management | Pharmacy Inventory Management System</title>

    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/warehouse.css">

</head>

<body>

    <!-- Hero Section -->

    <section class="dashboard-hero">

        <div class="hero-content">

            <h1>Warehouse Management</h1>

            <p>
                Manage warehouse inventory, stock availability,
                storage locations, and medicine distribution.
            </p>

        </div>

    </section>

    <main class="dashboard-container">

        <!-- Action Buttons -->

        <div class="header-actions">

            <button
                class="primary-btn"
                onclick="openAddModal()">

                Add Warehouse Stock

            </button>

            <button
                id="uploadWarehouseBtn"
                class="primary-btn">

                Upload CSV

            </button>

            <button
                id="downloadWarehouseBtn"
                class="primary-btn">

                Download CSV

            </button>

        </div>

        <input
            type="file"
            id="warehouseCsvFile"
            accept=".csv"
            style="display:none;">

        <!-- Search -->

        <section class="search-card">

            <input
                type="text"
                id="warehouseSearch"
                placeholder="Search warehouse records...">

        </section>

        <!-- Table -->

        <section class="table-card">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Medicine ID</th>
                        <th>Warehouse</th>
                        <th>Location</th>
                        <th>Stock Quantity</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="warehouseTable">

                    <tr>

                        <td
                            colspan="6"
                            class="empty-state">

                            Loading warehouse records...

                        </td>

                    </tr>

                </tbody>

            </table>

        </section>

    </main>

    <!-- Modal -->

    <div
        id="modal"
        class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="title">
                    Add Warehouse Stock
                </h2>

                <p>
                    Enter warehouse inventory information.
                </p>

            </div>

            <div class="form-group">

                <label for="medicine_id">
                    Medicine ID
                </label>

                <input
                    id="medicine_id"
                    placeholder="Enter medicine ID">

            </div>

            <div class="form-group">

                <label for="warehouse_name">
                    Warehouse Name
                </label>

                <input
                    id="warehouse_name"
                    placeholder="Enter warehouse name">

            </div>

            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                    id="location"
                    placeholder="Enter location">

            </div>

            <div class="form-group">

                <label for="stock_quantity">
                    Stock Quantity
                </label>

                <input
                    id="stock_quantity"
                    placeholder="Enter stock quantity">

            </div>

            <div class="modal-buttons">

                <button
                    onclick="saveWarehouse()"
                    class="primary-btn">

                    Save

                </button>

                <button
                    onclick="closeModal()"
                    class="secondary-btn">

                    Cancel

                </button>

            </div>

        </div>

    </div>

    <script
    type="module"
    src="js/warehouse.js">
</script>

</body>

</html>
