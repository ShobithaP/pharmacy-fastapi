<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | Pharmacy Inventory Management System</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <section class="auth-hero">

        <div class="hero-content">

            <h1>Pharmacy Inventory Management System</h1>

            <p>
                Create your account to manage medicines, warehouses,
                orders, users, and pharmacy operations from one centralized platform.
            </p>

        </div>

    </section>

    <section class="auth-section">

        <div class="auth-card">

            <div class="auth-header">

                <h2>Create Account</h2>

                <p>
                    Complete the registration form to get started.
                </p>

            </div>

            <form id="registerForm">

                <div class="form-group">

                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required>

                </div>

                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required>

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required>

                </div>

                <div class="form-group">

                    <label for="role">Role</label>

                    <select id="role" required>

                        <option value="">Select Role</option>
                        <option value="SUPER ADMIN">SUPER ADMIN</option>
                        <option value="ADMIN">ADMIN</option>
                        <option value="WAREHOUSE_MANAGER">WAREHOUSE MANAGER</option>
                        <option value="PHARMACIST">PHARMACIST</option>
                        <option value="CUSTOMER">CUSTOMER</option>

                    </select>

                </div>

                <button
                    type="submit"
                    class="btn-primary">

                    Create Account

                </button>

            </form>

            <p class="bottom-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>

    <script type="module" src="js/register.js"></script>

</body>

</html>
