<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Pharmacy Inventory Management System</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <!-- Hero Section -->

    <section class="auth-hero">

        <div class="hero-content">

            <h1>Pharmacy Inventory Management System</h1>

            <p>
                Sign in to access medicines, inventory, warehouses,
                orders, users, and pharmacy management tools.
            </p>

        </div>

    </section>

    <!-- Login Form -->

    <section class="auth-section">

        <div class="auth-card">

            <div class="auth-header">

                <h2>Welcome Back</h2>

                <p>
                    Login to continue managing pharmacy operations.
                </p>

            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn-primary">

                    Login

                </button>

            </form>

            <p class="bottom-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </section>

    <script type="module" src="js/login.js"></script>

</body>

</html>
