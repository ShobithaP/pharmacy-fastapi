<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Users Management | Pharmacy Inventory Management System</title>

    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/users.css">

</head>

<body>

    <!-- Hero Section -->

    <section class="dashboard-hero">

        <div class="hero-content">

            <h1>Users Management</h1>

            <p>
                Manage administrators, pharmacists, warehouse managers,
                and customer accounts across the pharmacy system.
            </p>

        </div>

    </section>

    <main class="dashboard-container">

        <!-- Actions -->

        <div class="header-actions">

            <button
                id="addUserBtn"
                type="button"
                class="primary-btn">

                Add User

            </button>

        </div>

        <!-- Search -->

        <section class="search-card">

            <input
                type="text"
                id="searchUser"
                placeholder="Search users by name, email, or role">

        </section>

        <!-- Users Table -->

        <section class="table-card">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="userTable">

                    <tr>

                        <td
                            colspan="5"
                            class="empty-state">

                            Loading users...

                        </td>

                    </tr>

                </tbody>

            </table>

        </section>

    </main>

    <!-- User Modal -->

    <div
        id="userModal"
        class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Add User
                </h2>

                <p>
                    Enter user details and assign an appropriate role.
                </p>

            </div>

            <form id="userForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required>

                </div>

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address"
                        required>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required>

                </div>

                <div class="form-group">

                    <label for="role">
                        Role
                    </label>

                    <select
                        id="role"
                        required>

                        <option value="">Select Role</option>

                        <option value="ADMIN">
                            Admin
                        </option>

                        <option value="PHARMACIST">
                            Pharmacist
                        </option>

                        <option value="WAREHOUSE_MANAGER">
                            Warehouse Manager
                        </option>

                        <option value="CUSTOMER">
                            Customer
                        </option>

                    </select>

                </div>

                <div class="modal-buttons">

                    <button
                        type="submit"
                        class="primary-btn">

                        Save

                    </button>

                    <button
                        type="button"
                        id="cancelBtn"
                        class="secondary-btn">

                        Cancel

                    </button>

                </div>

            </form>

        </div>

    </div>

    <script
        type="module"
        src="js/users.js"></script>

</body>

</html>
