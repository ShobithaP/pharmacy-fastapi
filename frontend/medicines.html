<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medicine Management | Pharmacy Inventory Management System</title>

    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/medicines.css">
</head>

<body>

    <!-- Hero Section -->

    <section class="dashboard-hero">

        <div class="hero-content">

            <h1>Medicine Management</h1>

            <p>
                Manage medicine records, manufacturers, pricing,
                and inventory information from one centralized platform.
            </p>

        </div>

    </section>

    <main class="dashboard-container">

        <!-- Action Buttons -->

        <div class="header-actions">

            <button
                id="addMedicineBtn"
                class="primary-btn">
                Add Medicine
            </button>

            <button
                id="uploadMedicineBtn"
                class="primary-btn">
                Upload CSV
            </button>

            <button
                id="downloadMedicineBtn"
                class="primary-btn">
                Download CSV
            </button>

        </div>

        <input
            type="file"
            id="medicineCsvFile"
            accept=".csv"
            style="display:none;">

        <!-- Search -->

        <section class="search-card">

            <input
                type="text"
                id="searchMedicine"
                placeholder="Search medicine by name or manufacturer">

        </section>

        <!-- Table -->

        <section class="table-card">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Medicine Name</th>
                        <th>Manufacturer</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="medicineTable">

                    <tr id="loadingRow">

                        <td
                            colspan="5"
                            class="empty-state">

                            Loading medicines...

                        </td>

                    </tr>

                </tbody>

            </table>

        </section>

    </main>

    <!-- Modal -->

    <div
        id="medicineModal"
        class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Add Medicine
                </h2>

            </div>

            <form id="medicineForm">

                <input
                    type="hidden"
                    id="medicineId">

                <div class="form-group">

                    <label for="name">
                        Medicine Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter medicine name"
                        required>

                </div>

                <div class="form-group">

                    <label for="manufacturer">
                        Manufacturer
                    </label>

                    <input
                        type="text"
                        id="manufacturer"
                        placeholder="Enter manufacturer name"
                        required>

                </div>

                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        min="0"
                        step="0.01"
                        placeholder="Enter price"
                        required>

                </div>

                <div class="modal-buttons">

                    <button
                        type="submit"
                        class="primary-btn">
                        Save
                    </button>

                    <button
                        type="button"
                        id="cancelBtn"
                        class="secondary-btn">
                        Cancel
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script type="module" src="js/medicines.js"></script>

</body>

</html>
