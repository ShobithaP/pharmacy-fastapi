<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Inventory Management System | Medicines</title>

    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/medicines.css">
</head>

<body>

<div class="layout">

    <main class="content">

        <header class="page-header">

            <div>
                <h1>Medicines</h1>
                <p>Manage medicine inventory and stock.</p>
            </div>

            <div style="display:flex; gap:10px;">

                <button id="addMedicineBtn" class="primary-btn">
                    + Add Medicine
                </button>

                <button id="uploadMedicineBtn" class="primary-btn">
                    Upload CSV
                </button>

                <button id="downloadMedicineBtn" class="primary-btn">
                    Download CSV
                </button>

            </div>

        </header>

        <input
            type="file"
            id="medicineCsvFile"
            accept=".csv"
            style="display:none;"
        >

        <section class="toolbar">

            <input
                type="text"
                id="searchMedicine"
                placeholder="Search medicines..."
            >

        </section>

        <section class="table-card">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Manufacturer</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="medicineTable">

                    <tr id="loadingRow">
                        <td colspan="5" class="empty-state">
                            Loading medicines...
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>

</div>

<div id="medicineModal" class="modal">

    <div class="modal-content">

        <h2 id="modalTitle">
            Add Medicine
        </h2>

        <form id="medicineForm">

            <input
                type="hidden"
                id="medicineId"
            >

            <div class="form-group">

                <label for="name">
                    Medicine Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter medicine name"
                    required
                >

            </div>

            <div class="form-group">

                <label for="manufacturer">
                    Manufacturer
                </label>

                <input
                    type="text"
                    id="manufacturer"
                    placeholder="Company name"
                    required
                >

            </div>

            <div class="form-group">

                <label for="price">
                    Price
                </label>

                <input
                    type="number"
                    id="price"
                    min="0"
                    step="0.01"
                    placeholder="0.00"
                    required
                >

            </div>

            <div class="modal-buttons">

                <button
                    type="submit"
                    class="primary-btn">
                    Save
                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    class="secondary-btn">
                    Cancel
                </button>

            </div>

        </form>

    </div>

</div>

<script type="module" src="js/medicines.js"></script>

</body>
</html>
